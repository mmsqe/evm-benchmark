temporal:
  host_port: 127.0.0.1:7233
  namespace: default
  task_queue: EVM_BENCHMARK_TASK_QUEUE

start:
  workflow_id: evm-benchmark-local

benchmark:
  data_dir: /private/tmp/evm-benchmark-local/data/out
  out_dir: /private/tmp/evm-benchmark-local/output

  # runtime mode
  runner_type: local
  start_node: true

  # patchimage stage
  patch_image:
    enabled: false

  # chain profile
  chain_config: evmd
  chains_config_path: ../config/chains.jsonnet
  # optional: if set, account keys are derived from this phrase deterministically
  base_mnemonic: "notable error gospel wave pair ugly measure elite toddler cost various fly make eye ketchup despair slab throw tribe swarm word fruit into inmate"

  # optional deep-merge patches
  # config_patch merges into config.toml
  # app_patch merges into app.toml
  # genesis_patch merges into genesis.json
  config_patch:
    log_level: info
    mempool:
      # type "app" hands the mempool to the EVM app, so this size is inert —
      # the capacity that matters is app_patch.evm.mempool below.
      type: "app"
      size: 50000
    consensus:
      timeout_commit: "20ms"
  app_patch:
    evm:
      mempool:
        "operate-exclusively": true
        # Sized to hold the whole load. The defaults (global-slots 5120,
        # global-queue 1024, account-slots 16) hold ~6k transactions, so an
        # unthrottled 200k load drops three quarters of itself and the run
        # measures rejection instead of throughput. These are evmd's names for
        # reth's pending-max-count / queued-max-count / max-account-slots, so
        # the tempo and allegro examples set the same capacities.
        "global-slots": 250000
        "global-queue": 250000
        "account-slots": 100
        "account-queue": 100
        "insert-queue-size": "50000"
    json-rpc:
      api: eth,net,web3,txpool
  genesis_patch:
    consensus:
      params:
        block:
          # Far above what a block actually fills, so gas is not the binding
          # constraint — matching the tempo and allegro examples.
          max_gas: "3000000000"

  # benchmark shape
  validators: 1
  fullnodes: 0
  num_accounts: 2000
  num_txs: 100
  num_idle: 40
  broadcast_concurrency: 32
  # See the allegro example: the default 5,000-pending pause caps the backlog
  # and measures the sender rather than the chain.
  broadcast_pending_watermark: 250000

  # workflow behavior
  # when true, starter loads existing data_dir/nodes.json and will NOT regenerate node homes/genesis
  skip_generate_layout: true
  pre_generate_txs: true
  run_nodes: true
  validator_generate_load: true
