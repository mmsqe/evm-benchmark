temporal:
  host_port: 127.0.0.1:7233
  namespace: default
  task_queue: EVM_BENCHMARK_TASK_QUEUE

start:
  workflow_id: evm-benchmark-sample

benchmark:
  data_dir: /private/tmp/data/out
  out_dir: /tmp/evm-benchmark/output

  # runtime mode
  runner_type: docker
  docker_image: "evmd-benchmark-patched:local"
  start_node: true
  docker_keep_containers: true
  docker_volumes:
    - /tmp/colima:/outputs
  docker_env:
    JOB_COMPLETION_INDEX: "0"

  # patchimage stage
  patch_image:
    enabled: false
    to_image: "evmd-benchmark-patched:local"
    source_dir: "/private/tmp/data/out"

  # chain profile
  chain_config: evmd
  chains_config_path: ../config/chains.jsonnet
  # optional: if set, account keys are derived from this phrase deterministically
  base_mnemonic: "notable error gospel wave pair ugly measure elite toddler cost various fly make eye ketchup despair slab throw tribe swarm word fruit into inmate"

  # optional deep-merge patches
  # config_patch merges into config.toml
  # app_patch merges into app.toml
  # genesis_patch merges into genesis.json
  config_patch:
    log_level: info
    mempool:
      # type "app" hands the mempool to the EVM app, so this size is inert —
      # the capacity that matters is app_patch.evm.mempool below.
      type: "app"
      size: 50000
    consensus:
      timeout_commit: "20ms"
  app_patch:
    evm:
      mempool:
        "operate-exclusively": true
    json-rpc:
      api: eth,net,web3,txpool
  genesis_patch:
    consensus:
      params:
        block:
          # Far above what a block actually fills, so gas is not the binding
          # constraint — matching the tempo and allegro examples.
          max_gas: "3000000000"

  # benchmark shape
  validators: 1
  fullnodes: 0
  # 2,000 x 100, matching the local example. 8,000 senders x 40 measured 2,127
  # tx/s against 6,695 for the same 200k load in this shape: more senders make
  # evmd's proposal assembly walk more accounts per block, and it built 103-tx
  # blocks instead of ~700. Load goes up via accounts only to ~100 txs each —
  # see "Comparing chains" in the README.
  num_accounts: 2000
  num_txs: 100
  num_idle: 40
  # cap concurrent eth_sendRawTransaction requests to avoid exhausting local sockets
  broadcast_concurrency: 32
  # Transactions per JSON-RPC request; one round trip each caps the sender
  # near 50k tx/s. See "Measuring" in the README.
  broadcast_batch_size: 100
  # Negative: never pause. See "Measuring".
  broadcast_pending_watermark: -1

  # workflow behavior
  # when true, starter loads existing data_dir/nodes.json and will NOT regenerate node homes/genesis
  skip_generate_layout: true
  pre_generate_txs: true
  run_nodes: true
  validator_generate_load: true
